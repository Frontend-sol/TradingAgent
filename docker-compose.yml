version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: autotrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autotrading
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: autotrading-redis
    restart: unless-stopped
    command: ["redis-server", "--protected-mode", "yes", "--requirepass", "${REDIS_PASSWORD:-change-this-redis-password}"]
    ports:
      - "127.0.0.1:6379:6379"

  app:
    build: .
    container_name: autotrading-app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-autotrading}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-this-redis-password}@redis:6379
    ports:
      - "3000:3000"

volumes:
  postgres_data:
